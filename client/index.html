<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A smarter campus lost-and-found. Report missing items, share finds, and bring belongings home." />
    <meta name="theme-color" content="#f8f9fa" />
    <title>TraceBack — Campus Lost &amp; Found</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("traceback-theme");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : systemPrefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
